name: Check and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sdk:
    name: Build and verify browser SDK
    runs-on: ubuntu-24.04
    container:
      # Keep the browser image version aligned with Playwright in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: "2026.11.8"
      - run: mise exec -- npm ci
      - run: mise exec -- npm audit --audit-level=high
      - run: mise run check
      - run: mise exec -- npm run test:browser
      - run: mise exec -- npm run sdk:build
      - run: mise exec -- npm run test:sdk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liatris-browser
          path: |
            dist/sdk/liatris-browser.tar.gz
            dist/sdk/SHA256SUMS
          if-no-files-found: error

  streaming:
    name: Verify the example streaming adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f integration/kinesis/compose.yaml up --build --abort-on-container-exit --exit-code-from verification
      - if: always()
        run: docker compose -f integration/kinesis/compose.yaml down --volumes

  release:
    name: Publish verified SDK
    needs: [sdk, streaming]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f LICENSE
          test "$RELEASE_TAG" = "v$(node --print "require('./package.json').version")"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: liatris-browser
          path: release
      - name: Verify the archive
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          tar -xOf liatris-browser.tar.gz liatris-browser/LICENSE | cmp - ../LICENSE
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/liatris-browser.tar.gz release/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" \
            --notes 'TypeScript browser SDK with session handling and durable HTTP/JSON delivery. See the integration guide for setup and receiver requirements.'
