<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liatris collector demo</title>
  </head>
  <body>
    <main>
      <h1>Liatris collector demo</h1>
      <p>Search the sample catalog and click a result. The terminal shows accepted searches, visible results, clicks, and measured dwell.</p>
      <label><input type="checkbox" id="consent" autocomplete="off" disabled> Allow collection in this tab</label>
      <p id="consent-status" role="status">Collection disabled.</p>
      <form id="search">
        <label for="term">Sample query</label>
        <select id="term">
          <option>garden tools</option>
          <option>no results</option>
        </select>
        <button type="submit">Search</button>
      </form>
      <p id="summary" role="status"></p>
      <ul id="results"></ul>
      <section id="detail" aria-labelledby="detail-title" hidden>
        <h2 id="detail-title">Product details</h2>
        <p>Sample product details.</p>
        <button type="button" id="close-detail">Close detail</button>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/assets/demo/browser.js"></script>
  </body>
</html>
