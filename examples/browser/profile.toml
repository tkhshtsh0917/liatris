version = 1
ubiSchema = "1.3.0"
tenant = "sample"
application = "help-center"
endpoint = "/api/ubi"
schemaMode = "compat"
allowQueryText = false

[events.search_submitted]

[events.results_shown.fields.result_set]
type = "string"
maxLength = 100
required = true

[events.results_shown.fields.result_count]
type = "integer"
minimum = 0
required = true

[events.results_shown.fields.ranking_version]
type = "string"
maxLength = 100
required = true

[events.result_impression.fields.result_set]
type = "string"
maxLength = 100
required = true

[events.click.fields.result_set]
type = "string"
maxLength = 100
required = true
