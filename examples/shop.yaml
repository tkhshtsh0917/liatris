version: 1
ubiSchema: "1.3.0"
tenant: sample
application: storefront
endpoint: /api/ubi
schemaMode: compat
allowQueryText: true
events:
  search_submitted: {}
  results_shown:
    fields:
      result_set: { type: string, maxLength: 100, required: true }
      result_count: { type: integer, minimum: 0, required: true }
      ranking_version: { type: string, maxLength: 100, required: true }
  click:
    fields:
      result_set: { type: string, maxLength: 100, required: true }
      detail_view_id: { type: string, maxLength: 100 }
      first_click_ms: { type: integer, minimum: 0 }
  result_impression:
    fields:
      result_set: { type: string, maxLength: 100, required: true }
  result_dwell:
    fields:
      result_set: { type: string, maxLength: 100, required: true }
      detail_view_id: { type: string, maxLength: 100, required: true }
      engaged_ms: { type: integer, required: true }
      session_elapsed_ms: { type: integer, required: true }
  add_cart: {}
extensions:
  query_attributes:
    experiment_id: { type: string, maxLength: 64 }
  event_attributes:
    surface: { type: string, maxLength: 32 }
  event_attributes.object:
    is_sponsored: { type: boolean }
