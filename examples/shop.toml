version = 1
ubiSchema = "1.3.0"
tenant = "sample"
application = "storefront"
endpoint = "/api/ubi"
schemaMode = "compat"
allowQueryText = true

[events.search_submitted]

[events.results_shown.fields.result_set]
type = "string"
maxLength = 100
required = true

[events.results_shown.fields.result_count]
type = "integer"
minimum = 0
required = true

[events.results_shown.fields.ranking_version]
type = "string"
maxLength = 100
required = true

[events.click.fields.first_click_ms]
type = "integer"
minimum = 0

[events.click.fields.result_set]
type = "string"
maxLength = 100
required = true

[events.result_impression.fields.result_set]
type = "string"
maxLength = 100
required = true

[events.click.fields.detail_view_id]
type = "string"
maxLength = 100

[events.result_dwell.fields.result_set]
type = "string"
maxLength = 100
required = true

[events.result_dwell.fields.detail_view_id]
type = "string"
maxLength = 100
required = true

[events.result_dwell.fields.engaged_ms]
type = "integer"
required = true

[events.result_dwell.fields.session_elapsed_ms]
type = "integer"
required = true

[events.add_cart]

[extensions.query_attributes.experiment_id]
type = "string"
maxLength = 64

[extensions.event_attributes.surface]
type = "string"
maxLength = 32

# The quoted segment preserves the literal UBI extension path.
[extensions."event_attributes.object".is_sponsored]
type = "boolean"
