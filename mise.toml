[tools]
node = "24.22.3"

[tasks.wasm]
run = "cargo build --locked --release --target wasm32-unknown-unknown"

[tasks.check]
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings",
  "cargo test --locked",
  "mise run wasm",
  "npm run lint",
  "npm run typecheck",
  "npm test",
]
